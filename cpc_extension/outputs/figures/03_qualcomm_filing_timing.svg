  <g id="text_28">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #53636c" transform="translate(27.72 381.17025)">84.6% of 2023 classifier-negative grants were filed in 2020–2021. Median grant lag: 2.12 → 2.30 years.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #53636c" transform="translate(27.72 391.248281)">Filing date is for the direct application, not earliest family priority. This is not a census of all filings.</text>
